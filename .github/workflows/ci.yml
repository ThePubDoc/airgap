name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download its own JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # assembleRelease runs verifyReleaseNoNetworkPermission, so a dependency that
      # adds internet access fails the build. No signing key here: the APK is unsigned.
      - name: Unit tests, lint and release build
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports
