<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 85% 20%, #1F3A68 0%, #0F1A2B 55%, #0A1220 100%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: #E8EEF7;
    position: relative;
  }
  /* Card stack, left */
  .stack { position: absolute; left: 86px; top: 92px; width: 380px; height: 320px; }
  .card {
    position: absolute; width: 330px; height: 206px; border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    padding: 22px 24px; box-sizing: border-box; color: #fff;
  }
  .card .name { font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .card .num { position: absolute; left: 24px; bottom: 54px; font: 500 25px/1 "SF Mono", Menlo, monospace; letter-spacing: 1px; }
  .card .exp { position: absolute; right: 24px; bottom: 22px; font-size: 15px; opacity: .9; }
  .card .holder { position: absolute; left: 24px; bottom: 22px; font-size: 14px; letter-spacing: 1px; opacity: .9; }
  .c1 { background: #8A1C2B; left: 40px; top: 0;   transform: rotate(-9deg); }
  .c2 { background: #0F5E5C; left: 22px; top: 48px; transform: rotate(-3deg); }
  .c3 { background: #1F3A68; left: 0;    top: 104px; transform: rotate(3deg); border: 1px solid rgba(255,255,255,.12); }
  /* Text, right */
  .text { position: absolute; left: 520px; top: 0; height: 500px; width: 460px; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: flex; align-items: center; gap: 16px; }
  .mark { width: 56px; height: 40px; position: relative; }
  .mark i { position: absolute; top: 0; height: 40px; width: 25px; background: #E8EEF7; }
  .mark .l { left: 0; border-radius: 6px 0 0 6px; }
  .mark .r { right: 0; border-radius: 0 6px 6px 0; }
  .mark b { position: absolute; left: 0; right: 0; top: 10px; height: 7px; background: #13213A; }
  h1 { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -1px; }
  .tag { margin: 22px 0 28px; font-size: 27px; line-height: 1.3; font-weight: 500; color: #C9D4E6; }
  .chips { display: flex; gap: 8px; flex-wrap: nowrap; }
  .chip { white-space: nowrap; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: rgba(232,238,247,.10); border: 1px solid rgba(232,238,247,.22); color: #E8EEF7; }
</style>
</head>
<body>
  <div class="stack">
    <div class="card c1"></div>
    <div class="card c2"></div>
    <div class="card c3"><div class="name">Travel Credit</div><div class="num">•••• 1111</div><div class="holder">JANE DOE</div><div class="exp">08/29</div></div>
  </div>
  <div class="text">
    <div class="logo"><div class="mark"><i class="l"></i><i class="r"></i><b></b></div><h1>Airgap</h1></div>
    <div class="tag">Your cards stay on your phone.<br>Encrypted. Never online.</div>
    <div class="chips"><span class="chip">No internet access</span><span class="chip">Fingerprint lock</span><span class="chip">Open source</span></div>
  </div>
</body>
</html>
